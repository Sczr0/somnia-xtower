# CNB 构建流水线 — PhiInfo 方案
# 提取引擎: PhiInfo (C# + AssetsTools.NET) 替代 Python (UnityPy)
# 仓库: r-0semi/somnia-xtower → 产物: r-0semi/asset-xtower
main:
  web_trigger_build:
    - docker:
        image: mcr.microsoft.com/dotnet/sdk:10.0
      imports: https://cnb.cool/r-0semi/secrets-xtower/-/blob/main/env.yml
      runner:
        tags: cnb:arch:amd64
        cpus: 8
      stages:
        # 1. 安装工具 (translate/info_export/phira/generate_index 均为纯标准库，UnityPy 仅用于 keyStore 兜底)
        - name: Install Tools
          script: |
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends aria2 python3 python3-pip python3-pil
            pip install --break-system-packages UnityPy==1.10.18 || echo "UnityPy 安装失败，keyStore 兜底不可用（不阻断）"

        # 2. 克隆 PhiInfo 源码并编译
        - name: Build PhiInfo
          script: |
            git clone --depth=1 https://github.com/PhigrosLabs/PhiInfo.git /tmp/phiinfo
            dotnet build /tmp/phiinfo/src/PhiInfo.CLI -c Release

        # 3. 下载 APK (链接由 CF Worker 触发时传入)
        - name: Download APK
          script: aria2c -x16 "$APK_DOWNLOAD_URL" -o game.apk

        # 4. PhiInfo 导出所有资源（输出 PNG，前端需要 PNG 格式）
        - name: PhiInfo Export
          script: dotnet /tmp/phiinfo/src/PhiInfo.CLI/bin/Release/net10.0/PhiInfo.CLI.dll -p game.apk --image-format Png export -o output

        # 5. 翻译目录结构（asset/ → chart / music / illustration / avatar）
        - name: Translate Output
          script: python3 translate.py

        # 5.1 keyStore 兜底（PhiInfo 不导出 single.txt / illustration.txt，失败不阻断）
        - name: Extract keyStore (best-effort)
          script: python3 gameInformation.py --keystore-only game.apk output || echo "keystore fallback failed (non-blocking)"

        # 5.2 生成并校验 /info 发布契约（唯一生产者，失败即失败）
        - name: Export Published Info
          script: python3 info_export.py

        # 6. 补齐缺失资产：illustration PNG → lilith WebP/AVIF + 低分辨率 PNG
        - name: Generate Missing Assets
          script: python3 generate_lowres.py

        # 7. 打包 Phira (.pez)
        - name: Package Phira
          script: python3 phira.py

        # 8. 生成网站索引（files.json + _redirects + checksums + 静态文件）
        - name: Generate Site Index
          script: python3 -c "import generate_index; generate_index.generate_site_resources()"

        # 9. 推送产物到 asset-xtower (先清空旧文件防止 build residue)
        - name: Push to asset-xtower
          script: |
            git clone --depth=1 "https://cnb:${CNB_TOKEN}@cnb.cool/r-0semi/asset-xtower.git" /tmp/asset-repo
            rm -rf /tmp/asset-repo/chart /tmp/asset-repo/music /tmp/asset-repo/illustration /tmp/asset-repo/illustrationBlur /tmp/asset-repo/illustrationLowRes /tmp/asset-repo/avatar /tmp/asset-repo/info /tmp/asset-repo/phira
            cp -r output/* /tmp/asset-repo/
            python3 info_export.py --verify-only /tmp/asset-repo
            cd /tmp/asset-repo
            git config user.name "r-0semi"
            git config user.email "sczr0710@163.com"
            git add -A
            git commit -m "Update assets" || echo "No changes to commit"
            git push
